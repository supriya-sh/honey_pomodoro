<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="timer.css">
</head>
<body>
    <div class="container">
        <div class="back-arrow" onclick="goBack()"></div> 
        <br><p5 id="timerstartpage"></p5>
        <p id="done"></p>
        <div class="timing-buttons">
            <div class="stop-box" onclick="startTimer()" id="timerButton">
                <div class="stop-icon"></div>
            </div>
            <div class="stop-box" onclick="resetTimer()" id="resetButton">
                <div class="reset-icon"></div>
            </div>
        </div>
        <button class="start" onclick="startTimer()" id="start-btn"> Start</button>
    </div>
    
    <script src="java.js"></script>
</body>
</html>
