<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Honey Pomodoro Timer💛🍯</h1>
        <p3>What is your ideal time to keep on studying⋆. 𐙚 ˚?</p3>
        <select id="studytime">
            <option value="25">25 minutes</option>
            <option value="30">30 minutes</option>
            <option value="45">45 minutes</option>
            <option value="50">50 minutes</option>
            <option value="60">60 minutes</option>
            <option value="90">90 minutes</option>
        </select>
        <br><p1>Your break-time will be: </p1>
        <br><p2 id="breaktime"></p2>
        <br>    <p5 id="timer">00:00 </p5>
        <p id="done"></p>
        <br><br><button class="start" onclick="startTimer()">Start⋆˚✿˖°</button>

    </div>
    <script src="java.js"></script>
</body>
</html>
